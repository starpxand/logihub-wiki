<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1b3f" flood-opacity="0.12"/>
    </filter>
    <style>
      .col{fill:#f6f8fc;stroke:#dbe2f0;stroke-width:1.5}
      .ttl{font-size:15px;font-weight:700;fill:#0b1b3f;letter-spacing:.06em}
      .box{fill:#fff;stroke:#c9d4ea;stroke-width:1.5}
      .svc{fill:#fff;stroke:#2f5bea;stroke-width:1.8}
      .db{fill:#0b1b3f}
      .t{font-size:15px;font-weight:600;fill:#0f172a}
      .s{font-size:12px;fill:#64748b}
      .w{font-size:15px;font-weight:700;fill:#fff}
      .ws{font-size:12px;fill:#dbe4ff}
      .lbl{font-size:12px;fill:#475569;font-weight:600}
      .ln{stroke:#94a3b8;stroke-width:2;fill:none}
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="560" rx="18" fill="#ffffff"/>

  <!-- Колонка: клиенты -->
  <rect class="col" x="20" y="20" width="230" height="520" rx="14"/>
  <text class="ttl" x="135" y="52" text-anchor="middle">КЛИЕНТЫ</text>
  <g filter="url(#sh)">
    <rect class="box" x="40" y="80" width="190" height="72" rx="10"/>
    <rect class="box" x="40" y="182" width="190" height="72" rx="10"/>
    <rect class="box" x="40" y="284" width="190" height="72" rx="10"/>
    <rect class="box" x="40" y="386" width="190" height="72" rx="10"/>
  </g>
  <text class="t" x="58" y="111">Веб-кабинет</text><text class="s" x="58" y="132">клиент, менеджер, диспетчер</text>
  <text class="t" x="58" y="213">Приложение водителя</text><text class="s" x="58" y="234">Android / iOS, сканер</text>
  <text class="t" x="58" y="315">Telegram-бот</text><text class="s" x="58" y="336">заявки, статусы, KPI</text>
  <text class="t" x="58" y="417">Дашборд</text><text class="s" x="58" y="438">аналитика OTIF и финансов</text>

  <!-- Шлюз -->
  <g filter="url(#sh)">
    <rect x="300" y="200" width="170" height="160" rx="16" fill="url(#gw)"/>
  </g>
  <text class="w" x="385" y="258" text-anchor="middle" fill="#1b1300" style="fill:#1b1300">API Gateway</text>
  <text x="385" y="284" text-anchor="middle" font-size="12" fill="#3b2a00">JWT-аутентификация</text>
  <text x="385" y="302" text-anchor="middle" font-size="12" fill="#3b2a00">rate limit</text>
  <text x="385" y="320" text-anchor="middle" font-size="12" fill="#3b2a00">маршрутизация</text>

  <!-- Колонка: микросервисы -->
  <rect class="col" x="520" y="20" width="300" height="520" rx="14"/>
  <text class="ttl" x="670" y="52" text-anchor="middle">МИКРОСЕРВИСЫ</text>
  <g filter="url(#sh)">
    <rect class="svc" x="540" y="74" width="260" height="76" rx="10"/>
    <rect class="svc" x="540" y="164" width="260" height="76" rx="10"/>
    <rect class="svc" x="540" y="254" width="260" height="76" rx="10"/>
    <rect class="svc" x="540" y="344" width="260" height="76" rx="10"/>
    <rect class="svc" x="540" y="434" width="260" height="76" rx="10"/>
  </g>
  <text class="t" x="560" y="106">Заказы</text><text class="s" x="560" y="128">заявки, расчёт, договор-счёт, закрытие</text>
  <text class="t" x="560" y="196">Склад</text><text class="s" x="560" y="218">комплектация, маркировка, ТТН</text>
  <text class="t" x="560" y="286">Маршрутизация</text><text class="s" x="560" y="308">маршрут, транспорт, водитель</text>
  <text class="t" x="560" y="376">Трекинг</text><text class="s" x="560" y="398">статусы, геопозиция, ETA, задержки</text>
  <text class="t" x="560" y="466">Уведомления</text><text class="s" x="560" y="488">e-mail, push, Telegram</text>

  <!-- Колонка: данные -->
  <rect class="col" x="870" y="20" width="230" height="520" rx="14"/>
  <text class="ttl" x="985" y="52" text-anchor="middle">ДАННЫЕ</text>
  <g filter="url(#sh)">
    <rect class="db" x="890" y="80" width="190" height="80" rx="10"/>
    <rect class="db" x="890" y="186" width="190" height="80" rx="10"/>
    <rect class="db" x="890" y="292" width="190" height="80" rx="10"/>
    <rect class="db" x="890" y="398" width="190" height="80" rx="10"/>
  </g>
  <text class="w" x="908" y="114">PostgreSQL 16</text><text class="ws" x="908" y="136">схема на каждый сервис</text>
  <text class="w" x="908" y="220">Redis 7</text><text class="ws" x="908" y="242">кэш, сессии, ETA</text>
  <text class="w" x="908" y="326">RabbitMQ</text><text class="ws" x="908" y="348">события между сервисами</text>
  <text class="w" x="908" y="432">S3-хранилище</text><text class="ws" x="908" y="454">ТТН, акты, фото груза</text>

  <!-- Связи -->
  <path class="ln" d="M230 116 C 270 116, 270 250, 298 250" marker-end="url(#arr)"/>
  <path class="ln" d="M230 218 C 262 218, 262 270, 298 270" marker-end="url(#arr)"/>
  <path class="ln" d="M230 320 C 262 320, 262 290, 298 290" marker-end="url(#arr)"/>
  <path class="ln" d="M230 422 C 270 422, 270 310, 298 310" marker-end="url(#arr)"/>
  <text class="lbl" x="243" y="186">HTTPS</text>

  <path class="ln" d="M470 250 C 505 250, 505 112, 538 112" marker-end="url(#arr)"/>
  <path class="ln" d="M470 265 C 505 265, 505 202, 538 202" marker-end="url(#arr)"/>
  <path class="ln" d="M470 280 L 538 292" marker-end="url(#arr)"/>
  <path class="ln" d="M470 300 C 505 300, 505 382, 538 382" marker-end="url(#arr)"/>
  <text class="lbl" x="482" y="176">REST</text>

  <path class="ln" d="M800 112 L 888 120" marker-end="url(#arr)"/>
  <path class="ln" d="M800 202 C 840 202, 850 226, 888 226" marker-end="url(#arr)"/>
  <path class="ln" d="M800 292 C 840 292, 850 332, 888 332" marker-end="url(#arr)"/>
  <path class="ln" d="M888 346 C 850 346, 840 382, 802 382" marker-end="url(#arr)" stroke-dasharray="6 5"/>
  <path class="ln" d="M888 356 C 850 356, 840 472, 802 472" marker-end="url(#arr)" stroke-dasharray="6 5"/>
  <text class="lbl" x="822" y="428">события</text>
</svg>
